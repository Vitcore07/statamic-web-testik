<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firemné procesy pod kontrolou</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;   
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 10px;
            padding: 2rem 1rem;
            border: 3px solid #A766FB;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            text-align: center;
            margin: 5rem 0 5rem 0;
        }

        .cont {
            border: 2px solid #A766FB;
            border-style: dotted;
            border-radius: 1.25rem;
        }

        .badge {
            display: inline-block;
            background-color: #f1f5f9;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .features-list {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            color: #334155;
            font-weight: 500;
        }

        .feature-item i {
            color: #3985BE;
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 3.5rem;
            margin-bottom: 3.5rem;
            border: 2px solid #A766FB;
            border-style: dotted;
            border-radius: 1.25rem;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1.25rem;
            padding: 2rem;
            text-align: left;
        }

        .icon-wrapper {
            color: #3985BE;
            font-size: 1.5rem;
            margin-bottom: 1.25rem;
            display: inline-block;
        }

        .card h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.925rem;
            color: #64748b;
            line-height: 1.5;
        }

        .footer-text {
            font-size: 1.1rem;
            color: #475569;
            line-height: 1.6;
            font-weight: 400;
            border: 2px solid #A766FB;    
            border-style: dotted;    
            border-radius: 1.25rem;    
        }
    </style>
</head>
<body>

<div class="container">
    <div class="cont">
        <span class="badge">Overené praxou</span>
        <h1>Firemné procesy pod kontrolou</h1>        
        <div class="features-list">
            {{ collection:features }}            
                <div class="feature-item">
                    <i class="fa-solid fa-check"></i>
                    <h3>{{ title }}</h3>
                </div>
            {{ /collection:features }}
        </div> 
    </div>
        <div class="grid">
            {{ collection:sluzby }}
                <div class="card">
                    <i class="fa-solid {{ icon }}"></i>
                    <h3>{{ title }}</h3>
                    <p>{{ popis }}</p>
                </div>
            {{ /collection:sluzby }}    
        </div>

        <p class="footer-text">
            Skončujte s chaosom<br>
            <strong>a majte vo firme poriadok.</strong>
        </p>
</div>
</body>
</html>
