title: Main-feature
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: role
            field:
              type: text
              display: Role
          -
            handle: desc
            field:
              type: textarea
              display: Desc
          -
            handle: logo
            field:
              container: assets
              type: assets
              display: Logo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  new_tab:
    display: 'New Tab'
    sections:
      -
        display: 'New Section'
